dataset:
  value: "fluids.incompressible.TaylorGreenVortex"
num_trajectories:
  value: 4096
model_name:
  value: "T"
seed:
  value: 0
dataloader_num_workers:
  value: 4
dataloader_pin_memory:
  value: true
dataset_kwargs:
  value:
    resolution: 128
    max_num_time_steps: 20
    time_step_size: 1
    allowed_time_transitions: [1]
    dt: 0.05
    reynolds_number: 50000.0
    viscosity: 0.00002
    just_velocities: true
lr:
  value: 0.00005
lr_embedding_recovery:
  value: 0.0005
lr_time_embedding:
  value: 0.0005
weight_decay:
  value: 0.000001
lr_scheduler:
  value: "cosine"
warmup_ratio:
  value: 0.05
early_stopping_patience:
  value: 20
num_epochs:
  value: 20
batch_size:
  value: 16
max_grad_norm:
  value: 5.0
physics_regularization:
  value:
    dx: 0.04908738521234052
    dy: 0.04908738521234052
    dt_scale: 1.0
    tau: 0.0
    normalize: true
    warmup_ratio: 0.1
    velocity_channels: "velocity"
    regularizers:
      - kind: "fluid_energy_2d"
        lambda_energy: 0.01
        viscosity: 0.00002
        mode: "equality"
      - kind: "enstrophy_2d"
        lambda_enstrophy: 0.001
        viscosity: 0.00002
        mode: "equality"
      - kind: "divergence_2d"
        lambda_divergence: 0.001
